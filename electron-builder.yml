# Instalador de Windows.
#   npm run instalador → solo genera el instalador en release/<versión>/
#   npm run release    → lo genera y lo publica en GitHub Releases (necesita GH_TOKEN);
#                        las apps instaladas se actualizan solas desde ahí.
appId: com.tadevstudio.fitnesscontrol
productName: FitnessControl
copyright: © 2026 TADevStudio
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
# SQLite (better-sqlite3) es un módulo nativo: tiene que quedar fuera del asar.
asarUnpack:
  - '**/*.node'
npmRebuild: true
# Solo los idiomas que hacen falta (Chromium trae más de 50).
electronLanguages: [es, es-419, en-US]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Aparece en las propiedades del .exe y en "Aplicaciones instaladas".
  legalTrademarks: FitnessControl es un producto de TADevStudio
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FitnessControl
  artifactName: FitnessControl-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages: [es_ES]
  language: '3082'
  # Al desinstalar NO se borran los datos (%APPDATA%\fitness-control).
  deleteAppDataOnUninstall: false
# Actualizaciones: GitHub Releases del repo (público). electron-updater lee latest.yml.
publish:
  provider: github
  owner: jtapiaa22
  repo: FitnessControl
  releaseType: release
